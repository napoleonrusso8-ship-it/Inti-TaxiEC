# Solo para desarrollo local. Las contraseñas vienen de .env (no versionado).
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: intitaxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: intitaxi
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}"]
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
